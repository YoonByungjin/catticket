name: CI

on:
  pull_request:
  push:
    branches: [main]

# 最小権限: リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # ローカルと同じ MySQL 8.4。テストは test_catticket を使う（CLAUDE.md「テスト」）
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: test_catticket
          MYSQL_USER: catticket
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DB_NAME: test_catticket
      DB_USER: catticket
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle の依存関係をキャッシュする
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test

  # frontend ジョブ（lint / test / build）は frontend/ を作る PR で frontend-dev が追加する

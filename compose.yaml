# Local development: MySQL + Django dev server (backend/).
# The Angular app (frontend/) will be added as another service.
# Values come from .env (see .env.example).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Only reachable from this PC (for MySQL Workbench), not from the network
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts here run once on first start (empty volume), e.g. test DB grants
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      # Inside the compose network the database is reached by its service name
      DB_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Mount the source so code changes reload without rebuilding the image
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:

<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CatTicket</title>
<!-- Google Fonts: Noto Sans KR (weights 400, 500) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4338CA",
            "on-primary": "#FFFFFF",
            "primary-container": "#EEF2FF",
            tertiary: "#B45309",
            "tertiary-container": "#FFFBEB",
            success: "#166534",
            "success-container": "#F0FDF4",
            text: "#1F2937",
            "secondary-text": "#4B5563",
            outline: "#D1D5DB",
            placeholder: "#E5E7EB",
            surface: "#FFFFFF",
            "surface-container-low": "#F9FAFB",
            "surface-container": "#F3F4F6"
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            headline: ['"Noto Sans KR"', 'sans-serif'],
            display: ['"Noto Sans KR"', 'sans-serif'],
            body: ['"Noto Sans KR"', 'sans-serif'],
            label: ['"Noto Sans KR"', 'sans-serif']
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            lg: "1rem",
            xl: "1.5rem",
            full: "9999px"
          }
        }
      }
    };
  </script>
<style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      color: #1F2937;
      background-color: #F3F4F6;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex justify-center items-center p-0 sm:p-4">
<!-- Mobile Screen Container (390px default mobile shell) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-white overflow-hidden shadow-2xl flex flex-col sm:rounded-[32px] sm:border sm:border-[#D1D5DB]">
<!-- 1. Header Bar -->
<header class="h-[56px] bg-white border-b border-[#D1D5DB] px-4 flex items-center justify-between z-30 shrink-0">
<!-- Left Brand Headline -->
<span class="font-medium text-lg text-[#4338CA] tracking-tight">CatTicket</span>
<!-- Right Action Group -->
<div class="flex items-center gap-2">
<!-- Segmented Language Toggle -->
<div aria-label="Language selector" class="rounded-full border border-[#D1D5DB] p-0.5 flex bg-white text-xs items-center" role="group">
<button class="bg-[#EEF2FF] text-[#4338CA] font-medium px-2.5 py-1 rounded-full transition-colors focus:outline-none" type="button">
            한국어
          </button>
<button class="text-[#4B5563] px-2.5 py-1 rounded-full transition-colors focus:outline-none hover:text-[#1F2937]" type="button">
            日本語
          </button>
</div>
<!-- Hamburger Menu Button -->
<button aria-label="메뉴 열기" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-[#1F2937] rounded-full hover:bg-[#F3F4F6] transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
</header>
<!-- 2. MAP AREA (Flexible Middle Canvas) -->
<main class="relative flex-1 bg-[#E5E7EB] w-full overflow-hidden flex flex-col justify-between">
<!-- Top Floating Controls: Search & Condition Filter -->
<div class="relative z-20 flex gap-2 px-3 pt-3 w-full">
<!-- Outlined White Search Field -->
<div class="bg-white border border-[#D1D5DB] rounded-full h-11 px-4 flex-1 text-sm text-[#1F2937] flex items-center shadow-xs">
<span class="material-symbols-outlined text-[#4B5563] mr-2 text-[18px]" data-icon="search">search</span>
<span class="text-sm text-[#4B5563]">키워드(공연명)</span>
</div>
<!-- Stroked Condition Button -->
<button class="bg-white border border-[#D1D5DB] rounded-full h-11 px-4 text-sm font-medium text-[#1F2937] flex items-center gap-1.5 min-h-[44px] shrink-0 active:bg-[#F9FAFB] transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[#1F2937] text-[18px]" data-icon="tune">tune</span>
<span>조건</span>
</button>
</div>
<!-- Map Center Annotation -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="text-xs text-[#9CA3AF] tracking-wide font-normal">지도 영역 (Google Maps)</span>
</div>
<!-- 5 Circular Venue Markers -->
<!-- Marker 1 -->
<div aria-label="공연장 3개소" class="absolute top-[28%] left-[22%] w-8 h-8 rounded-full bg-[#4338CA] text-white text-xs font-medium flex items-center justify-center shadow-sm select-none">
        3
      </div>
<!-- Marker 2 -->
<div aria-label="공연장 1개소" class="absolute top-[22%] right-[26%] w-8 h-8 rounded-full bg-[#4338CA] text-white text-xs font-medium flex items-center justify-center shadow-sm select-none">
        1
      </div>
<!-- Marker 3 -->
<div aria-label="공연장 2개소" class="absolute top-[44%] left-[46%] w-8 h-8 rounded-full bg-[#4338CA] text-white text-xs font-medium flex items-center justify-center shadow-sm select-none">
        2
      </div>
<!-- Marker 4 -->
<div aria-label="공연장 5개소" class="absolute top-[38%] right-[16%] w-8 h-8 rounded-full bg-[#4338CA] text-white text-xs font-medium flex items-center justify-center shadow-sm select-none">
        5
      </div>
<!-- Marker 5 -->
<div aria-label="공연장 1개소" class="absolute top-[52%] left-[26%] w-8 h-8 rounded-full bg-[#4338CA] text-white text-xs font-medium flex items-center justify-center shadow-sm select-none">
        1
      </div>
<!-- Lower Map Layer Floating Controls (Immediately above Bottom Sheet) -->
<div class="relative z-20 w-full px-4 pb-3 flex items-end justify-between pointer-events-none">
<!-- Text Link: 출처 -->
<a class="pointer-events-auto text-xs text-[#4B5563] underline hover:text-[#1F2937] py-1 transition-colors" href="#source">
          출처
        </a>
<!-- Floating Primary Button: 근처 보기 -->
<button class="pointer-events-auto bg-[#4338CA] text-white rounded-full h-11 px-4 text-sm font-medium flex items-center gap-1.5 shadow-md min-h-[44px] active:bg-[#3730A3] transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-white text-[18px]" data-icon="my_location">my_location</span>
<span>근처 보기</span>
</button>
</div>
</main>
<!-- 6. Bottom Sheet (Covering ~45% of Screen) -->
<section class="h-[380px] bg-[#F9FAFB] rounded-t-[28px] shadow-[0_-4px_16px_rgba(0,0,0,0.08)] p-4 flex flex-col gap-3 shrink-0 z-30 overflow-hidden">
<!-- Drag Handle -->
<div aria-hidden="true" class="w-8 h-1 bg-[#D1D5DB] rounded-full mx-auto mb-1 shrink-0"></div>
<!-- Segmented Toggle (지도 / 목록) -->
<div aria-label="보기 모드 선택" class="rounded-full border border-[#D1D5DB] p-0.5 flex bg-white text-xs self-start shrink-0" role="tablist">
<button aria-selected="false" class="text-[#4B5563] px-3 py-1 rounded-full transition-colors focus:outline-none" role="tab" type="button">
          지도
        </button>
<button aria-selected="true" class="bg-[#EEF2FF] text-[#4338CA] font-medium px-3 py-1 rounded-full transition-colors focus:outline-none" role="tab" type="button">
          목록
        </button>
</div>
<!-- Count Text -->
<div class="text-sm font-medium text-[#1F2937] shrink-0">
        검색 결과 128건
      </div>
<!-- Performance Cards Stack -->
<div class="flex flex-col gap-3 overflow-y-auto pr-0.5">
<!-- Card 1 -->
<article class="bg-white border border-[#D1D5DB] rounded-[12px] p-3 flex gap-3 cursor-pointer hover:border-[#4338CA] transition-colors">
<!-- Poster Placeholder -->
<div class="w-[72px] h-[96px] bg-[#E5E7EB] rounded flex items-center justify-center text-xs text-[#4B5563] shrink-0 select-none">
            포스터
          </div>
<!-- Card Body Content -->
<div class="flex flex-col justify-between flex-1 min-w-0">
<div>
<h2 class="text-[16px] font-medium text-[#1F2937] truncate leading-tight mb-1">뮤지컬 〈별빛 정거장〉</h2>
<p class="text-[14px] text-[#4B5563] truncate leading-snug">대학로 소나무극장</p>
<p class="text-xs text-[#4B5563] leading-snug mt-0.5">2026-10-01 ~ 2026-12-31</p>
</div>
<!-- Badges and Rating -->
<div class="mt-2 flex flex-col gap-1.5">
<div class="flex items-center gap-1.5 flex-wrap">
<span class="border border-[#D1D5DB] text-[#4B5563] text-xs px-2 py-0.5 rounded-[8px] leading-none">
                  뮤지컬
                </span>
<span class="bg-[#F0FDF4] text-[#166534] text-xs px-2 py-0.5 rounded-[8px] font-medium leading-none">
                  공연 중
                </span>
<span class="bg-[#FFFBEB] text-[#B45309] text-xs px-2 py-0.5 rounded-[8px] font-medium leading-none">
                  수상작
                </span>
</div>
<div class="text-xs text-[#B45309] font-medium flex items-center leading-none">
<span>★ 4.3 (12)</span>
</div>
</div>
</div>
</article>
<!-- Card 2 -->
<article class="bg-white border border-[#D1D5DB] rounded-[12px] p-3 flex gap-3 cursor-pointer hover:border-[#4338CA] transition-colors">
<!-- Poster Placeholder -->
<div class="w-[72px] h-[96px] bg-[#E5E7EB] rounded flex items-center justify-center text-xs text-[#4B5563] shrink-0 select-none">
            포스터
          </div>
<!-- Card Body Content -->
<div class="flex flex-col justify-between flex-1 min-w-0">
<div>
<h2 class="text-[16px] font-medium text-[#1F2937] truncate leading-tight mb-1">연극 〈봄날의 편지〉</h2>
<p class="text-[14px] text-[#4B5563] truncate leading-snug">서울 한빛아트홀</p>
<p class="text-xs text-[#4B5563] leading-snug mt-0.5">2026-11-20 ~ 2027-01-15</p>
</div>
<!-- Badges and Rating -->
<div class="mt-2 flex flex-col gap-1.5">
<div class="flex items-center gap-1.5 flex-wrap">
<span class="border border-[#D1D5DB] text-[#4B5563] text-xs px-2 py-0.5 rounded-[8px] leading-none">
                  연극
                </span>
<span class="bg-[#EEF2FF] text-[#4338CA] text-xs px-2 py-0.5 rounded-[8px] font-medium leading-none">
                  공연 예정
                </span>
</div>
<div class="text-[12px] text-[#4B5563] leading-none">
                아직 리뷰가 없습니다
              </div>
</div>
</div>
</article>
</div>
</section>
</div>
</body></html>
